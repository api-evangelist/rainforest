simulation_endpoints:
  note: Sandbox-only endpoints advance resource statuses and fire the corresponding webhooks.
  operations:
  - simulate_deposit_status
  - simulate_merchant_deposit
  - simulate_merchant_application
  - simulate_payin_ach_return
