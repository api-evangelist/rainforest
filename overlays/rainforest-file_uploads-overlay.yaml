overlay: 1.0.0
info:
  title: API Evangelist enhancements for Rainforest file_uploads
  version: 1.0.0
extends: openapi/rainforest-file_uploads-openapi.yaml
actions:
- target: $.info
  update:
    x-apievangelist-provider: rainforest
    x-apievangelist-service: file_uploads
    x-apievangelist-auth: http-bearer-apikey
    x-apievangelist-idempotency: idempotency_key on config objects
    x-apievangelist-error-format: custom-envelope
