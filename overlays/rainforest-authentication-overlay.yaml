overlay: 1.0.0
info:
  title: API Evangelist enhancements for Rainforest authentication
  version: 1.0.0
extends: openapi/rainforest-authentication-openapi.yaml
actions:
- target: $.info
  update:
    x-apievangelist-provider: rainforest
    x-apievangelist-service: authentication
    x-apievangelist-auth: http-bearer-apikey
    x-apievangelist-idempotency: idempotency_key on config objects
    x-apievangelist-error-format: custom-envelope
