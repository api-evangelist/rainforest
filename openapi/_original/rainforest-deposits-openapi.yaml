n","description":"Only available in the Rainforest sandbox environment.\n\nSimulate processing a deposit on a merchant. Any payins or refunds with the status of `PROCESSING` will be transitioned to the status of `SUCCEEDED`.\n\nThe expected webhooks will be sent for all payins and refunds while the deposit is processing. The `deposit.processing` webhook will be sent when the deposit has been processed and the deposit status is `PROCESSING`.\n\nOn a merchant with a Daily Net billing configuration, a deposit will be processed with an amount that corresponds to the payment activity, less any applicable fees.\n\nOn a merchant with a Daily Gross billing configuration, two deposits will be processed:\n  1. A funding deposit with an amount that corresponds to the gross amount of the payment activity.\n  2. A billing deposit with an amount that corresponds to the applicable billing fees of the payment activity.\n\nOn a merchant with a Monthly Gross billing configuration, only the funding deposit will be processed with an amount that corresponds to the gross amount of the payment activity.","parameters":[{"$ref":"#/paths/~1v1~1deposits/get/parameters/0"},{"in":"path","required":true,"name":"merchant_id","schema":{"type":"string"},"description":"The unique merchant identifier. \n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","examples":{"production":{"value":"mid_2DrDFJPutxE5AIbJSopAnqniEbr"},"sandbox":{"value":"sbx_mid_2DrDFJPutxE5AIbJSopAnqniEbr"}}}],"responses":{"204":{"description":"No Content.\n\nThe merchant deposit(s) have been processed with a deposit status of `PROCESSING`."},"400":{"$ref":"#/paths/~1v1~1deposits/get/responses/400"},"401":{"$ref":"#/paths/~1v1~1deposits/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1deposits/get/responses/403"},"404":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/404"},"5XX":{"$ref":"#/paths/~1v1~1deposits/get/responses/5XX"}},"tags":["Deposits"]}},"/v1/deposit_method_configs":{"post":{"operationId":"create_deposit_method_config","summary":"Create deposit method config","description":"Create the configuration to store a deposit method. The configuration contains basic information about the deposit method such as an idempotency key and optional information such as billing contact and metadata. If the billing contact is provided in the deposit method config, then the web component will not prompt for this data. These fields include name for an ACH deposit method. This allows a deposit method to be set up before collecting the sensitive deposit method details (i.e the account number) via the web component.","parameters":[{"$ref":"#/paths/~1v1~1deposits/get/parameters/0"}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/paths/~1v1~1deposit_method_configs/post/responses/200/content/application~1json/schema/properties/data","required":["platform_id","idempotency_key"]},"examples":{"required_fields":{"value":{"idempotency_key":"e7d57c41-7626-4644-b777-9451ab3ddea9","platform_id":"plt_2WaOekua4ZUEgUFCxNBsASulZMa"}},"billing_contact":{"value":{"idempotency_key":"e7d57c41-7626-4644-b777-9451ab3ddea9","billing_contact":{"name":"Jane Smith","address_line_1":"3423 Piedmont Rd","address_line_2":"Suite 123","city":"Atlanta","state":"GA","postal_code":"30305","country":"US","email":"janesmith@example.com","phone":"4041234567"}}},"metadata":{"value":{"idempotency_key":"e7d57c41-7626-4644-b777-9451ab3ddea9","metadata":{"key1":"value1","key2":{"inner_key1":"inner_value1"}}}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/status"},"data":{"type":"object","properties":{"deposit_method_config_id":{"readOnly":true,"description":"The unique deposit method config identifier. \n\nPrefix is \"dmc\" in production and \"sbx_dmc\" in sandbox.","type":"string","example":"dmc_2DrDPKzdQypRudLd8DhQKZX27dA"},"platform_id":{"description":"The unique platform identifier. \n\nPrefix is \"plt\" in production and \"sbx_plt\" in sandbox.","type":"string","example":"plt_2DrDypu8n6IX7EVTjAnEd1dkTBa"},"idempotency_key":{"description":"A unique identifier provided by the platform. This key will be used to detect subsequent retries of the same request. Subsequent requests with the same key will return the result of the first request, regardless if the first request succeeded or failed. This identifier should be generated by the platform and can be max 255 characters.","type":"string","example":"e7d57c41-7626-4644-b777-9451ab3ddea9","maxLength":255,"minLength":1},"billing_contact":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/billing_contact"},"allowed_sources":{"description":"The allowed deposit method sources for deposit method creation. If omitted, the allowed sources will default to all the allowed sources set on the platform configuration.","type":"array","items":{"type":"string","enum":["ENCRYPTED_ACH","PARTNER_PLAID"]}},"metadata":{"description":"Valid JSON key-value object specified by the platform to store additional information on the payment method. Keys are queryable in list endpoints. Do not use the metadata field to store sensitive or confidential data.\n\nMetadata must be less than 8 KB in size.\n","type":"object","example":{"key1":"value1","key2":{"inner_key1":"inner_value1"}},"minLength":0},"created_at":{"description":"Date and time deposit method config was created at in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z","readOnly":true}}},"errors":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/errors"}}}}}},"400":{"$ref":"#/paths/~1v1~1deposits/get/responses/400"},"401":{"$ref":"#/paths/~1v1~1deposits/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1deposits/get/responses/403"},"5XX":{"$ref":"#/paths/~1v1~1deposits/get/responses/5XX"}},"tags":["Deposit Method Configs"]}},"/v1/deposit_methods/{deposit_method_id}":{"get":{"operationId":"get_deposit_method","summary":"Get deposit method","description":"Get deposit method details by the deposit method ID.","parameters":[{"$ref":"#/paths/~1v1~1deposits/get/parameters/0"},{"in":"path","required":true,"name":"deposit_method_id","schema":{"type":"string"},"description":"The unique deposit method identifier. \n\nPrefix is \"dmt\" in production and \"sbx_dmt\" in sandbox.","examples":{"production":{"value":"dmt_2DrDRpyAdp5MPUJnrJmoZcMmtfF"},"sandbox":{"value":"sbx_dmt_2DrDRpyAdp5MPUJnrJmoZcMmtfF"}}}],"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/status"},"data":{"$ref":"#/paths/~1v1~1deposit_methods/post/responses/200/content/application~1json/schema/properties/data"},"errors":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/errors"}}}}}},"400":{"$ref":"#/paths/~1v1~1deposits/get/responses/400"},"401":{"$ref":"#/paths/~1v1~1deposits/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1deposits/get/responses/403"},"404":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/404"},"5XX":{"$ref":"#/paths/~1v1~1deposits/get/responses/5XX"}},"tags":["Deposit Methods"]}},"/v1/deposit_methods/{deposit_method_id}/payin":{"post":{"operationId":"create_deposit_method_payin","summary":"Create payin from deposit method","description":"Create and process a payin using a payin configuration and a deposit method. The merchant status must be ACTIVE to create a payin.\n\nThe deposit method details (i.e bank account number and billing contact) will be duplicated to a payment method and a payin will process against the newly created payment method. Metadata, method metadata, and new billing contact details can be defined on the [Payin Config](ref:create_payin_config).\n\nThis endpoint requires Rainforest approval.","parameters":[{"in":"header","name":"Rainforest-Api-Version","schema":{"type":"string","default":"2024-10-16","enum":["2024-10-16"]}},{"$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D/get/parameters/1","in":"path"}],"requestBody":{"content":{"application/json":{"schema":{"type":"object","properties":{"payin_config_id":{"description":"The unique payin config identifier. A payin must be configured prior to this request. See \"Create a Payin Config\" if a payin configuration has not been created yet.\n\nPrefix is \"cfg\" in production and \"sbx_cfg\" in sandbox.","type":"string","example":"cfg_2A4d6U0tMyovzTbVT1ktmRzdRaD"}},"required":["payin_config_id"]},"example":{"payin_config_id":"cfg_2A4d6U0tMyovzTbVT1ktmRzdRaD"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/status"},"data":{"description":"The payin details.","type":"object","properties":{"payin_id":{"description":"The unique payin identifier. \n\nPrefix is \"pyi\" in production and \"sbx_pyi\" in sandbox.","type":"string","example":"pyi_2DrDKk5NIMbpuNGqm109SkpGDHh"},"payin_config_id":{"$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/threeds_attempt/properties/payin_config_id","readOnly":true},"merchant_id":{"description":"The unique merchant identifier. \n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","type":"string","example":"mid_2DrDFJPutxE5AIbJSopAnqniEbr"},"payment_method_id":{"description":"The unique payment method identifier. \n\nPrefix is \"mtd\" in production and \"sbx_mtd\" in sandbox.","type":"string","example":"mtd_2DrDRpyAdp5MPUJnrJmoZcMmtfF"},"payment_method_config_id":{"readOnly":true,"description":"The unique payment method config identifier. \n\nPrefix is \"pmc\" in production and \"sbx_pmc\" in sandbox.","type":"string","example":"pmc_2DrDPKzdQypRudLd8DhQKZX27dA"},"device_registration_id":{"description":"The unique device registration identifier.\n\nPrefix is \"dvc\" in production and \"sbx_dvc\" in sandbox.","type":"string","example":"dvc_2DrDKk5NIMbpuNGqm109SkpGDHh"},"threeds_attempt_id":{"nullable":true,"description":"The unique threeds attempt identifier. \n\nPrefix is \"tds\" in production and \"sbx_tds\" in sandbox.","type":"string","example":"tds_2DrDFJPutxE5AIbJSopAnqniEbr"},"idempotency_key":{"$ref":"#/paths/~1v1~1deposit_method_configs/post/requestBody/content/application~1json/schema/properties/idempotency_key"},"billing_type":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/200/content/application~1json/schema/properties/data/properties/billing_type"},"amount":{"description":"The amount of the payin, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100},"currency_code":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/200/content/application~1json/schema/properties/data/properties/currency_code"},"is_partially_authorized":{"description":"Boolean indicating if payin was authorized for a partial amount.","type":"boolean"},"authorized_amount":{"description":"The amount of the payin that was authorized, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"captured_amount":{"description":"The amount of the payin that was captured, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"refundable_amount":{"description":"The amount of the payin that can still be refunded, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"non_refundable_reason_code":{"description":"Why the payin is nonrefundable. Provided when refundable_amount is 0.","type":"string","nullable":true,"readOnly":true,"enum":["VOIDED","FAILED","FULLY_REFUNDED","HAS_CHARGEBACKS","HAS_ACH_RETURN","IN_ACH_RETURN_WINDOW","IN_SETTLEMENT_WINDOW"]},"status":{"description":"The status of the payin.","type":"string","enum":["AUTHORIZED","CANCELED","CREATED","FAILED","IN_REVIEW","PRESENTING","PROCESSING","RETURNED","SUCCEEDED"],"example":"PROCESSING"},"refusal_code":{"description":"The code explaining the reason for the refusal if the payin or refund failed to process.\n\nThis value will be `null` if the payin or refund succeeded.","type":"string","enum":[null,"AUTHORIZATION_EXPIRED","DECLINED","DO_NOT_HONOR","EXPIRED_CARD","FRAUDULENT_CARD","INCORRECT_PAYMENT_INFORMATION","INSUFFICIENT_FUNDS","INVALID_CARD_SECURITY_CODE","INVALID_EXPIRATION_DATE","INVALID_PIN","LOST_CARD","NO_CARD_NUMBER_ON_FILE_WITH_ISSUER","NO_SUCH_CARD_ISSUER","OVER_LIMIT","PROCESSING_ERROR","RESTRICTED_CARD_TYPE","RETRY","RETRY_WITH_THREEDS","RISK_DECLINE","STOLEN_CARD","THREEDS_CHALLENGE_FAILED","UNEXPECTED_PAYIN_TOKEN","UNSUPPORTED_CARD_TYPE"],"readOnly":true},"refusal_desc":{"description":"The description explaining the reason for the refusal if the payin or refund failed to process. This will be a human-readable value that may be presented to the end user.\n\nThis value will be `null` if the payin or refund succeeded.","type":"string","enum":[null,"Authorization expired","Declined","Do not honor","Expired card","Fraudulent card","Incorrect payment information","Insufficient funds","Invalid card security code","Invalid expiration date","Invalid PIN","Lost card","No card number on file with issuer","No such card issuer","Over limit","Processing error","Restricted card type","Retry","Retry with 3DS","Risk decline","Stolen card","3DS challenge failed","Unexpected payin token","Unsupported card type"],"readOnly":true},"detailed_refusal_code":{"description":"The detailed refusal code that could be more descriptive than the refusal code. It may take up to 5 minutes for the detailed refusal code to populate after the payment fails.\n\nThis value will be `null` if the payment succeeded.","type":"string","enum":[null,"AUTHORIZATION_EXPIRED","DECLINED","DO_NOT_HONOR","EXPIRED_CARD","FRAUDULENT_CARD","INCORRECT_PAYMENT_INFORMATION","INSUFFICIENT_FUNDS","INVALID_CARD_SECURITY_CODE","INVALID_EXPIRATION_DATE","INVALID_PIN","LOST_CARD","NO_CARD_NUMBER_ON_FILE_WITH_ISSUER","NO_SUCH_CARD_ISSUER","OVER_LIMIT","PROCESSING_ERROR","RESTRICTED_CARD_TYPE","RETRY","RETRY_WITH_THREEDS","RISK_DECLINE","STOLEN_CARD","THREEDS_CHALLENGE_FAILED","UNEXPECTED_PAYIN_TOKEN","UNSUPPORTED_CARD_TYPE"],"readOnly":true},"detailed_refusal_desc":{"description":"The description explaining the detailed refusal reason if the payin or refund failed to process. This will be a human-readable value that may be presented to the end user.\n\nThis value will be `null` if the payment succeeded.","type":"string","enum":[null,"Authorization expired","Declined","Do not honor","Expired card","Fraudulent card","Incorrect payment information","Insufficient funds","Invalid card security code","Invalid expiration date","Invalid PIN","Lost card","No card number on file with issuer","No such card issuer","Over limit","Processing error","Restricted card type","Retry","Retry with 3DS","Risk decline","Stolen card","3DS challenge failed","Unexpected payin token","Unsupported card type"],"readOnly":true},"auth_code":{"description":"The authorization code if the payin was approved.","type":"string","example":"12345"},"avs_result_code":{"description":"The address verification service result code.","type":"string","example":"Y"},"cvc_result_code":{"description":"The card verification code result code.","type":"string","example":"M"},"amount_splits":{"description":"Represents how the payin amount was allocated to the originating merchant, the platform and one or more other merchants.<br/><br/>\n\nA `PLATFORM` split defines a platform fee on the payin.<br/><br/>\n\nA `MERCHANT` split allocates a portion of the payin to the specified merchant.<br/><br/>\n\nAny remaining amount not specified by the amount splits was allocated to the originating merchant associated with the payin.","type":"array","items":{"type":"object","properties":{"amount":{"description":"The amount allocated, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":3},"currency_code":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/200/content/application~1json/schema/properties/data/properties/currency_code"},"type":{"description":"The type of receiver for this split.<br/><br/>\n\n`PLATFORM` allocates the split amount to the platform. `MERCHANT` allocates the split amount to the merchant specified by merchant_id.","type":"string","enum":["PLATFORM","MERCHANT"]},"merchant_id":{"description":"Required when type is `MERCHANT`.<br/><br/>\n\nThe unique identifier of the merchant receiving this split. The merchant must be fully onboarded and in an ACTIVE status.<br/><br/>\n\nMust not match the merchant_id of the originating merchant on the payin. Must not be duplicated within the same amount_splits array. Not valid when object type is `PLATFORM`.<br/><br/>\n\nPrefix: mid in production, sbx_mid in sandbox.","type":"string","example":"mid_abc123"},"platform":{"description":"The minimal representation of the platform receiving this split. Present when type is `PLATFORM`.","type":"object","properties":{"platform_id":{"$ref":"#/paths/~1v1~1deposit_method_configs/post/requestBody/content/application~1json/schema/properties/platform_id","readOnly":true},"name":{"readOnly":true,"description":"The platform name.","type":"string","example":"Platform Name"}}},"merchant":{"description":"The minimal representation of the merchant receiving this split. Present when type is `MERCHANT`.","$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D~1activity/get/responses/200/content/application~1json/schema/properties/data/properties/activities/items/properties/merchant"}},"required":["amount","currency_code","type"]},"example":[{"amount":3,"currency_code":"USD","type":"PLATFORM"}]},"merchan