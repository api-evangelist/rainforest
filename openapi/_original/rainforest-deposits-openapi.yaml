ng","example":"Atlanta","maxLength":100},"state":{"description":"State, province, or region for address.","type":"string","example":"GA","maxLength":100},"postal_code":{"description":"Postal code or ZIP code for address.","type":"string","example":"30305","maxLength":15},"country":{"description":"2-digit country code. \nFind country codes here: https://www.iso.org/obp","type":"string","example":"US","maxLength":2,"minLength":2},"email":{"description":"Email address.","type":"string","example":"janesmith@example.com","maxLength":100},"phone":{"description":"Phone number, including extension.","type":"string","example":"+14041234567","maxLength":100}}}},"required":["deposit_method_config_id","method_type","ach"]}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/status"},"data":{"type":"object","properties":{"deposit_method_id":{"description":"The unique deposit method identifier. \n\nPrefix is \"dmt\" in production and \"sbx_dmt\" in sandbox.","type":"string","example":"dmt_2DrDRpyAdp5MPUJnrJmoZcMmtfF"},"deposit_method_config_id":{"$ref":"#/paths/~1v1~1deposit_method_configs/post/requestBody/content/application~1json/schema/properties/deposit_method_config_id","readOnly":true},"status":{"description":"The status of the deposit method.","type":"string","enum":["CREATED","ACTIVE","REPLACED"],"example":"ACTIVE"},"fingerprint":{"description":"The unique identifier of a deposit method across all platform merchants.","type":"string","example":"52q5eKHLvCOfRlYiNZL4hltKmXEnTIT8","readOnly":true},"method_type":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/method_type"},"ach":{"description":"ACH deposit method details.","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/ach"},"plaid_ach":{"description":"ACH deposit method details from Plaid.","type":"object","properties":{"account_number_last_4":{"$ref":"#/paths/~1v1~1deposit_methods/post/responses/200/content/application~1json/schema/properties/data/properties/ach/properties/account_number_last_4"},"routing_number":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/ach/properties/routing_number"},"bank_name":{"$ref":"#/paths/~1v1~1deposit_methods/post/responses/200/content/application~1json/schema/properties/data/properties/ach/properties/bank_name"},"account_type":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/ach/properties/account_type"},"account_holder_type":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/ach/properties/account_holder_type"}}},"billing_contact":{"$ref":"#/paths/~1v1~1deposit_methods/post/requestBody/content/application~1json/schema/properties/billing_contact"},"metadata":{"description":"Valid JSON key-value object specified by the platform to store additional information. Keys are queryable in list endpoints. Do not use the metadata field to store sensitive or confidential data.\n\nMetadata must be less than 8 KB in size.\n","type":"object","example":{"key1":"value1","key2":{"inner_key1":"inner_value1"}},"minLength":0},"replaces_deposit_method_id":{"description":"The unique identifier for the deposit method that was replaced by this deposit method.\n\nPrefix is \"dmt\" in production and \"sbx_dmt\" in sandbox.\n\nThis value will be `null` if this deposit method does not replace another deposit method.","type":"string","nullable":true,"example":"dmt_33FPts9UyEOKq91K2lAg9ZUM2ZS"},"replaced_by_deposit_method_id":{"description":"The unique identifier for the deposit method that replaced this deposit method.\n\nPrefix is \"dmt\" in production and \"sbx_dmt\" in sandbox.\n\nThis value will be `null` if the deposit method has not been replaced.","type":"string","nullable":true,"example":"dmt_33FPts9UyEOKq91K2lAg9ZUM2ZS"},"replaced_at":{"description":"Date and time deposit method was replaced in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"},"replaced_reason_code":{"description":"The code explaining the reason the deposit method was replaced.\n\nThis value will be `null` if the deposit method has not been replaced.","type":"string","nullable":true,"enum":["C01","C02","C03","C04","C05","C06","C07","C08","C09","C10","C11","C12"]},"replaced_reason_desc":{"description":"The description explaining the reason the deposit method was replaced. This will be a human-readable value that may be presented to the end user.\n\nThis value will be `null` if the deposit method has not been replaced.","type":"string","nullable":true,"examples":[null,"Incorrect account number","Incorrect routing number","Incorrect routing number and account number","Incorrect account name","Incorrect payment code","Incorrect account number and transit code","Incorrect routing number, account number and payment code","Incorrect foreign routing number","Incorrect individual identification number","Incorrect company name","Incorrect company identification","Incorrect company name and identification"],"readOnly":true},"created_at":{"description":"Date and time deposit method was created at in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"},"updated_at":{"description":"Date and time deposit method was last updated at in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"}}},"errors":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/errors"}}}}}},"400":{"$ref":"#/paths/~1v1~1deposits/get/responses/400"},"401":{"$ref":"#/paths/~1v1~1deposits/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1deposits/get/responses/403"},"5XX":{"$ref":"#/paths/~1v1~1deposits/get/responses/5XX"}},"tags":["Deposit Methods"]}}},"tags":[{"name":"Deposit Method Configs","description":"Resources for deposit method config functions."},{"name":"Deposit Methods","description":"Resources for deposit method functions."},{"name":"Deposits","description":"Resources for deposit functions."}],"components":{"securitySchemes":{"BearerAuth":{"type":"http","scheme":"bearer","bearerFormat":"APIKey"}}},"security":[{"BearerAuth":[]}]}