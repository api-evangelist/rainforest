payin/post/responses/200/content/application~1json/schema/properties/data/properties/threeds_attempt/properties/payin_config_id","readOnly":true},"processing_mode":{"readOnly":true,"description":"Determines how to process the payin when [creating the payin](ref:create_payin) via the Payment Component or the API.\n\nOptions:\n  * `AUTHORIZE` - Only authorize the payin, separating the authorization and capture of funds. Authorize will place a hold on the funds and the payin must be [captured](ref:capture_payin) in a separate request.\n  * `AUTHORIZE_AND_CAPTURE` - Authorize and capture the payin in a single request (default).","type":"string","default":"AUTHORIZE_AND_CAPTURE","enum":["AUTHORIZE","AUTHORIZE_AND_CAPTURE"]},"amount":{"description":"The total amount requested for processing, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"minimum":1,"readOnly":true},"currency_code":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/200/content/application~1json/schema/properties/data/properties/currency_code","readOnly":true},"amount_splits":{"readOnly":true,"type":"array","items":{"type":"object","properties":{"rate":{"description":"The amount split defined as a rate, in percent mille (1 PCM = 0.001%). The amount split will be calculated on the authorized amount of the payin.\n\nFor example, 3000 is 3%.","type":"integer","example":3000,"minimum":0},"rate_cap":{"description":"The amount split rate cap, in minor units. Used to cap the rate to a specified amount.\n\nFor example, 1000 is 10.00 USD.\n\nThe following validation must be met:\n  If the rate is greater than 0%, then the rate_cap must be greater than $0. For example, to bill a rate of 1% up to $100 set the value to 10000.\n  If the rate is 0%, then the rate_cap must be $0.","type":"integer","example":1000,"minimum":0},"amount":{"description":"The amount split, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":3,"minimum":0},"currency_code":{"$ref":"#/paths/~1v1~1deposits~1%7Bdeposit_id%7D/get/responses/200/content/application~1json/schema/properties/data/properties/currency_code"},"type":{"description":"The type of receiver for this split.<br/><br/>\n\n`PLATFORM` allocates the split amount to the platform. `MERCHANT` allocates the split amount to the merchant specified by merchant_id.","type":"string","enum":["PLATFORM","MERCHANT"]},"merchant_id":{"description":"Required when type is `MERCHANT`.<br/><br/>\n\nThe unique identifier of the merchant receiving this split. The merchant status must be ACTIVE.<br/><br/>\n\nThe following constraints must be met:\n\n- Cannot match the merchant_id of the originating merchant on the payin.\n- Cannot be duplicated within the same amount_splits array.\n- Not valid when type is `PLATFORM`.<br/><br/>\n\nPrefix is mid in production and sbx_mid in sandbox.","type":"string","example":"mid_abc123"},"amount_split_reversal_config":{"description":"Controls whether this amount split is reversed on a refund for the full amount or an ACH return. When not provided, both attributes default to false.","type":"object","properties":{"on_full_refund":{"description":"Determines whether this amount split is reversed when a refund for the full amount is processed on this payin.<br/><br/>\n\nWhen `true`, the receiver's allocation is pulled back on the refund. When `false`, the receiver retains their allocation and the originating merchant absorbs this amount of the refund.<br/><br/>\n\nThis configuration only applies to full refunds. For partial refunds, amount_splits on the refund request can be provided to specify the reversal amounts.","type":"boolean","default":false},"on_ach_return":{"description":"Determines whether this amount split is reversed when an ACH return is processed on this payin.<br/><br/>\n\nWhen `true`, the receiver's allocation is pulled back on the ACH return. When `false`, the receiver retains their allocation and the originating merchant absorbs this amount of the ACH return.","type":"boolean","default":false}}}},"required":["amount","currency_code","type"]},"example":[{"amount":3,"currency_code":"USD","type":"PLATFORM"}],"maxItems":26,"minItems":0}}},"threeds_attempt":{"nullable":true,"description":"3DS attempt details.","type":"object","properties":{"threeds_attempt_id":{"description":"The unique threeds attempt identifier. \n\nPrefix is \"tds\" in production and \"sbx_tds\" in sandbox.","type":"string","example":"tds_2DrDFJPutxE5AIbJSopAnqniEbr"},"merchant_id":{"$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/merchant_id"},"payin_config_id":{"description":"The unique payin config identifier. \n\nPrefix is \"cfg\" in production and \"sbx_cfg\" in sandbox.","type":"string","example":"cfg_2DrDPKzdQypRudLd8DhQKZX27dA"},"status":{"description":"The status of the threeds attempt.","type":"string","enum":["CREATED","FINGERPRINTED","SUCCEEDED","CHALLENGED","FAILED"],"example":"CREATED"},"failed_reason_code":{"description":"The code explaining the reason for the 3DS request failure.\n\nThis value will be set if the 3DS attempt status is `FAILED`.","type":"string","nullable":true,"readOnly":true,"enum":["3DS_ATTEMPT_TIMED_OUT","CARD_NOT_ENROLLED","CHALLENGE_FAILED","MERCHANT_NOT_BOARDED","UNEXPECTED_ERROR","UNSUPPORTED_PAYMENT_DATA"]},"failed_reason_desc":{"description":"The description explaining the reason for the payin's 3DS request failure. This will be a human-readable value that may be presented to the end user.\n\nThis value will be `null` if the 3DS request succeeded or if not applicable.","type":"string","nullable":true,"examples":["3DS attempt timed out","Card not enrolled to 3DS","Failed 3DS challenge","Merchant not boarded to 3DS","Unexpected error","Unsupported payment data"],"readOnly":true},"created_at":{"description":"The datetime at which the attempt was initiated, in RFC3339 format","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"},"updated_at":{"description":"The datetime at which the attempt was last updated, in RFC3339 format","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"},"fingerprinted_at":{"description":"The datetime at which the attempt was fingerprinted, in RFC3339 format\n\nThe 3DS fingerprint step may open a hidden IFRAME to the issuing bank, allowing the bank to run proprietary fingerprinting identification.","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"},"challenged_at":{"description":"The datetime at which the attempt was challenged, in RFC3339 format\n\nThe 3DS challenge step will display a modal dialog, provided by the issuing bank, for the customer to authenticate to their bank.","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"},"succeeded_at":{"description":"The datetime at which the attempt succeeded, in RFC3339 format\n\nThe 3DS attempt succeeded if the customer authenticates to their bank, frictionlessly or through the challenge step.","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"},"failed_at":{"description":"The datetime at which the attempt failed, in RFC3339 format\n\nThe 3DS attempt failed for a variety of reasons, such as issuer does not support 3DS or the customer fails to complete the challenge step.","$ref":"#/paths/~1v1~1deposit_methods~1%7Bdeposit_method_id%7D~1payin/post/responses/200/content/application~1json/schema/properties/data/properties/chargebacks/items/properties/created_at"}}},"expected_deposit_date":{"description":"Date the funds are expected to be available in a deposit.","type":"string","format":"date","example":"2022-01-01"},"source":{"description":"The source of the payin. Indicates the integration that created the payin.","type":"string","nullable":false,"enum":["API_DIRECT","API_STORED_PAYMENT_METHOD","COMPONENT","DEVICE","EXTERNAL","IVR","TAP_TO_PHONE"]},"source_desc":{"description":"The description of the source of the payin. This will be a human-readable value that may be presented to the end user.","type":"string","nullable":false},"created_at":{"description":"Date and time payin was created at in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"},"updated_at":{"description":"Date and time payin was last updated at in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"}}},"errors":{"$ref":"#/paths/~1v1~1deposits/get/responses/200/content/application~1json/schema/properties/errors"}}}}}},"400":{"$ref":"#/paths/~1v1~1deposits/get/responses/400"},"401":{"$ref":"#/paths/~1v1~1deposits/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1deposits/get/responses/403"},"409":{"description":"Conflict on the requested resource.","content":{"application/json":{"schema":{"$ref":"#/paths/~1v1~1deposits/get/responses/400/content/application~1json/schema"},"example":{"status":"ERROR","data":null,"errors":[{"field":"string","code":"string","message":"Conflict"}]}}}},"5XX":{"$ref":"#/paths/~1v1~1deposits/get/responses/5XX"}},"tags":["Deposit Methods"]}},"/v1/deposit_methods":{"post":{"operationId":"create_deposit_method","summary":"Create deposit method","description":"Create a deposit method. A deposit method is assigned to a merchant and is where the merchant's funds for their payment activity will be deposited to.\n\nTh