n the payment method type:\n* Card: `postal_code`\n* ACH: `name`\n\nThe billing contact fields can also be passed in the payin config."}},"required":["payin_config_id","method_type"]},"examples":{"card":{"value":{"payin_config_id":"cfg_2A4d6U0tMyovzTbVT1ktmRzdRaD","method_type":"CARD","card":{"card_number":"4111111111111111","exp_month":12,"exp_year":2027,"cvc":"123"},"billing_contact":{"name":"Jane Smith","address_line_1":"3423 Piedmont Rd","address_line_2":"Suite 123","city":"Atlanta","state":"GA","postal_code":"30305","country":"US","email":"janesmith@example.com","phone":"4041234567"}}},"ach":{"value":{"payin_config_id":"cfg_2A4d6U0tMyovzTbVT1ktmRzdRaD","method_type":"ACH","ach":{"account_number":"12345678","routing_number":"091000019","account_type":"CHECKING","account_holder_type":"PERSONAL"},"billing_contact":{"name":"Jane Smith","address_line_1":"3423 Piedmont Rd","address_line_2":"Suite 123","city":"Atlanta","state":"GA","postal_code":"30305","country":"US","email":"janesmith@example.com","phone":"4041234567"}}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1payins/get/responses/200/content/application~1json/schema/properties/status"},"data":{"description":"The payin details.","type":"object","properties":{"payin_id":{"description":"The unique payin identifier. \n\nPrefix is \"pyi\" in production and \"sbx_pyi\" in sandbox.","type":"string","example":"pyi_2DrDKk5NIMbpuNGqm109SkpGDHh"},"payin_config_id":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/threeds_attempt/properties/payin_config_id","readOnly":true},"merchant_id":{"$ref":"#/paths/~1v1~1device_registrations/post/requestBody/content/application~1json/schema/properties/merchant_id"},"payment_method_id":{"description":"The unique payment method identifier. \n\nPrefix is \"mtd\" in production and \"sbx_mtd\" in sandbox.","type":"string","example":"mtd_2DrDRpyAdp5MPUJnrJmoZcMmtfF"},"payment_method_config_id":{"$ref":"#/paths/~1v1~1payin_configs/post/requestBody/content/application~1json/schema/properties/payment_method_config_id","readOnly":true},"device_registration_id":{"description":"The unique device registration identifier.\n\nPrefix is \"dvc\" in production and \"sbx_dvc\" in sandbox.","type":"string","example":"dvc_2DrDKk5NIMbpuNGqm109SkpGDHh"},"threeds_attempt_id":{"nullable":true,"description":"The unique threeds attempt identifier. \n\nPrefix is \"tds\" in production and \"sbx_tds\" in sandbox.","type":"string","example":"tds_2DrDFJPutxE5AIbJSopAnqniEbr"},"idempotency_key":{"$ref":"#/paths/~1v1~1refunds~1%7Brefund_id%7D~1void/post/requestBody/content/application~1json/schema/properties/idempotency_key"},"billing_type":{"description":"The merchant billing type.","type":"string","enum":["NET","GROSS"]},"amount":{"description":"The amount of the payin, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100},"currency_code":{"$ref":"#/paths/~1v1~1payins~1%7Bpayin_id%7D~1void_or_refund/post/requestBody/content/application~1json/schema/properties/amount_splits/items/properties/currency_code"},"is_partially_authorized":{"description":"Boolean indicating if payin was authorized for a partial amount.","type":"boolean"},"authorized_amount":{"description":"The amount of the payin that was authorized, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"captured_amount":{"description":"The amount of the payin that was captured, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"refundable_amount":{"description":"The amount of the payin that can still be refunded, in minor units.\n\nFor example, 1000 is 10.00 USD.","type":"integer","example":100,"readOnly":true},"non_refundable_reason_code":{"description":"Why the payin is nonrefundable. Provided when refundable_amount is 0.","type":"string","nullable":true,"readOnly":true,"enum":["VOIDED","FAILED","FULLY_REFUNDED","HAS_CHARGEBACKS","HAS_ACH_RETURN","IN_ACH_RETURN_WINDOW","IN_SETTLEMENT_WINDOW"]},"status":{"$ref":"#/paths/~1v1~1payins/get/parameters/5/schema/items"},"refusal_code":{"description":"The code explaining the reason for the refusal if the payin or refund failed to process.\n\nThis value will be `null` if the payin or refund succeeded.","type":"string","enum":[null,"AUTHORIZATION_EXPIRED","DECLINED","DO_NOT_HONOR","EXPIRED_CARD","FRAUDULENT_CARD","INCORRECT_PAYMENT_INFORMATION","INSUFFICIENT_FUNDS","INVALID_CARD_SECURITY_CODE","INVALID_EXPIRATION_DATE","INVALID_PIN","LOST_CARD","NO_CARD_NUMBER_ON_FILE_WITH_ISSUER","NO_SUCH_CARD_ISSUER","OVER_LIMIT","PROCESSING_ERROR","RESTRICTED_CARD_TYPE","RETRY","RETRY_WITH_THREEDS","RISK_DECLINE","STOLEN_CARD","THREEDS_CHALLENGE_FAILED","UNEXPECTED_PAYIN_TOKEN","UNSUPPORTED_CARD_TYPE"],"readOnly":true},"refusal_desc":{"description":"The description explaining the reason for the refusal if the payin or refund failed to process. This will be a human-readable value that may be presented to the end user.\n\nThis value will be `null` if the payin or refund succeeded.","type":"string","enum":[null,"Authorization expired","Declined","Do not honor","Expired card","Fraudulent card","Incorrect payment information","Insufficient funds","Invalid card security code","Invalid expiration date","Invalid PIN","Lost card","No card number on file with issuer","No such card issuer","Over limit","Processing error","Restricted card type","Retry","Retry with 3DS","Risk decline","Stolen card","3DS challenge failed","Unexpected payin token","Unsupported card type"],"readOnly":true},"detailed_refusal_code":{"description":"The detailed refusal code that could be more descriptive than the refusal code. It may take up to 5 minutes for the detailed refusal code to populate after the payment fails.\n\nThis value will be `null` if the payment succeeded.","type":"string","enum":[null,"AUTHORIZATION_