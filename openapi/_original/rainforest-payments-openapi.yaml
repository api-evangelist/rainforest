pe":"string","nullable":true,"example":"mtd_2DrDRpyAdp5MPUJnrJmoZcMmtfF"},"replaced_at":{"description":"Date and time payment method was replaced in UTC RFC 3339 format.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"},"replaced_reason_code":{"description":"The code explaining the reason the payment method was replaced.\n\nThis value will be `null` if the payment method has not been replaced.","type":"string","nullable":true,"enum":["C01","C02","C03","C04","C05","C06","C07","C08","C09","C10","C11","C12"],"readOnly":true},"replaced_reason_desc":{"description":"The description explaining the reason the payment method was replaced. This will be a human-readable value that may be presented to the end user.\n\n This value will be `null` if the payment method has not been replaced.","type":"string","nullable":true,"examples":[null,"Incorrect account number","Incorrect routing number","Incorrect routing number and account number","Incorrect account name","Incorrect payment code","Incorrect account number and transit code","Incorrect routing number, account number and payment code","Incorrect foreign routing number","Incorrect individual identification number","Incorrect company name","Incorrect company identification","Incorrect company name and identification"],"readOnly":true},"replacement_disabled_at":{"description":"Date and time replacement was disabled for payment method in UTC RFC 3339 format.\nIndicating processes such as Card Account Updater (CAU) cannot be run on this payment method.","type":"string","format":"date-time","example":"2022-01-01T12:00:00Z"},"replacement_disabled_reason_code":{"description":"The code explaining the reason replacement was disabled for the payment method. \nSee the [replacement disabled reason codes](doc:replacement-disabled-reason-codes) guide for additional information.\n\nThis value will be `null` if replacement has not been disabled for the payment method.","type":"string","nullable":true,"enum":["D01","D02",