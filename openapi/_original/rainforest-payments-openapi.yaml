t":{"operationId":"create_payment_method","summary":"Create payment method","description":"Create a saved payment method.\n\nTo duplicate a saved payment method, set the payment_method_id of the payment method to be duplicated. Billing contact and metadata is not persisted from the duplicated payment method and must be defined on the [Payment Method Config](ref:create_payment_method_config) or on the request. Only the stored sensitive payment method details (i.e full card or bank account number) will persist to the duplicated payment method.\n\nIf the method_type is set, then this endpoint requires Rainforest approval. Platforms that meet all [requirements](doc:send-sensitive-data-via-api#requirements) and are approved by Rainforest can send the full card and bank account numbers to Rainforest via a server-to-serve direct API integration.","parameters":[{"$ref":"#/paths/~1v1~1payins/get/parameters/0"}],"requestBody":{"content":{"application/json":{"schema":{"type":"object","properties":{"payment_method_config_id":{"description":"The unique payment method config identifier. A payment method must be configured prior to this request. See \"Create a Payment Method Config\" if a payment method configuration has not been created yet.\n\nPrefix is \"pmc\" in production and \"sbx_pmc\" in sandbox.","type":"string","example":"pmc_2A4d6U0tMyovzTbVT1ktmRzdRaD","required":true},"payment_method_id":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/payment_method_id","description":"The unique payment method identifier of the payment method to duplicate. Required if method_type is not provided.\n\nThe payment method status must be `ACTIVE` or `REPLACED` to be duplicated. If `REPLACED`, Rainforest will automatically duplicate the most up-to-date information using the Active payment method linked to the Replaced payment method.\n\nThis will duplicate the sensitive payment method details (i.e full card or bank account number). Billing contact and metadata must be defined on the [Payment Method Config](ref:create_payment_method_config) or on the request.\n\nPrefix is \"mtd\" in production and \"sbx_mtd\" in sandbox."},"method_type":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/method_type","description":"The type of payment method. Required if payment_method_id is not provided."},"card":{"$ref":"#/paths/~1v1~1payins/post/requestBody/content/application~1json/schema/properties/card"},"ach":{"$ref":"#/paths/~1v1~1payins/post/requestBody/content/application~1json/schema/properties/ach"},"billing_contact":{"$ref":"#/paths/~1v1~1payin_configs/post/requestBody/content/application~1json/schema/properties/billing_contact","description":"Billing contact details. The following billing contact fields are **_required_** for payment processing depending on the payment method type:\n* Card: `postal_code`\n* ACH: `name`\n\nThe billing contact fields can also be passed when processing a payment using the stored payment method."}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1payins/get/responses/200/content/application~1json/schema/properties/status"},"data":{"type":"object","properties":{"payment_method_id":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/payment_method_id"},"payment_method_config_id":{"$ref":"#/paths/~1v1~1payin_configs/post/requestBody/content/application~1json/schema/properties/payment_method_config_id","readOnly":true},"device_registration_id":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/device_registration_id","readOnly":true},"billable_merchant_id":{"description":"The unique merchant identifier for the billable merchant, utilized in processes such as BIN Lookup and Card Account Updater. \n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","type":"string","example":"mid_2DrDFJPutxE5AIbJSopAnqniEbr"},"merchant_id":{"description":"The unique merchant identifier that indicates this payment method is restricted to this merchant.\n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","type":"string","example":"mid_2DrDFJPutxE5AIbJSopAnqniEbr"},"fingerprint":{"description":"The unique identifier of a payment method across all platform merchants.","type":"string","example":"52q5eKHLvCOfRlYiNZL4hltKmXEnTIT8","readOnly":true},"method_type":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/method_type"},"card":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/card"},"apple_pay":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/apple_pay"},"ach":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/ach"},"plaid_ach":{"description":"ACH payment method details from Plaid.","type":"object","properties":{"account_number_last_4":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/ach/properties/account_number_last_4"},"routing_number":{"$ref":"#/paths/~1v1~1payins/post/requestBody/content/application~1json/schema/properties/ach/properties/routing_number"},"bank_name":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properties/data/properties/ach/properties/bank_name"},"account_type":{"$ref":"#/paths/~1v1~1payins/post/requestBody/content/application~1json/schema/properties/ach/properties/account_type"},"account_holder_type":{"$ref":"#/paths/~1v1~1payins/post/requestBody/content/application~1json/schema/properties/ach/properties/account_holder_type"}}},"paypal_wallet":{"$ref":"#/paths/~1v1~1payins/post/responses/200/content/application~1json/schema/properti