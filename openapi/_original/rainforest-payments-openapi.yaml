s/~1v1~1payins~1%7Bpayin_id%7D/get/responses/404"},"5XX":{"$ref":"#/paths/~1v1~1payins/get/responses/5XX"}},"tags":["ACH Returns"]}},"/v1/bin_lookup":{"post":{"operationId":"create_bin_lookup","summary":"Create BIN lookup","description":"Retrieve information from the card's BIN, such as the card brand, card type, country, and other details.\n\nThis endpoint requires Rainforest approval. Platforms that meet all [requirements](doc:send-sensitive-data-via-api#requirements) and are approved by Rainforest can send the full card numbers to Rainforest via a server-to-serve direct API integration.","requestBody":{"content":{"application/json":{"schema":{"type":"object","properties":{"billable_merchant_id":{"description":"The unique merchant identifier for the billable merchant.\n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","$ref":"#/paths/~1v1~1payment_methods/post/responses/200/content/application~1json/schema/properties/data/properties/billable_merchant_id"},"card_number":{"description":"The card number, formatted with no spaces (e.g 0000000000000000).","type":"string","example":"4111111111111111"}},"required":["billable_merchant_id","card_number"]}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1payins/get/responses/200/content/application~1json/schema/properties/status"},"data":{"description":"The BIN lookup details.","type":"object","properties":{"bin_lookup_id":{"description":"The unique BIN lookup identifier. \n\nPrefix is \"bin\" in production and \"sbx_bin\" in sandbox.","type":"string","example":"bin_2DrDKk5NIMbpuNGqm109SkpGDHh"},"billable_merchant_id":{"description":"The unique merchant identifier for the billable merchant.\n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox.","$ref":"#/paths/~1v1~1payment_methods/post/responses/200/content/application~1json/schema/properties/data/properties/billable_merchant_id"},"bin":{"description":"The first 8 digits o