orest has successfully run 3DS on the specified card brand, the `verified_at` timestamp will be set. This is the indicator that the merchant was onboarded to 3DS successfully.","properties":{"american_express":{"$ref":"#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0/properties/threeds_onboarding/properties/visa","description":"The 3DS onboarding details with American Express."},"discover":{"$ref":"#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0/properties/threeds_onboarding/properties/visa","description":"The 3DS onboarding details with Discover."},"mastercard":{"$ref":"#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0/properties/threeds_onboarding/properties/visa","description":"The 3DS onboarding details with Mastercard."},"visa":{"description":"The 3DS onboarding details with Visa.","type":"object","readOnly":true,"properties":{"card_brand":{"description":"Card brand.","type":"string","example":"MASTERCARD","enum":["AMERICAN_EXPRESS","DISCOVER","MASTERCARD","VISA"]},"card_brand_desc":{"description":"Card brand in a friendly language.","type":"string","example":"Mastercard","enum":["American Express","Discover","Mastercard","Visa"]},"onboarded_at":{"type":"string","description":"Date and time the merchant was onboarded to the specified card brand for 3DS in UTC RFC 3339 format.","format":"date-time","example":"2022-01-01T12:00:00Z","readOnly":true,"nullable":true},"verified_at":{"type":"string","description":"Date and time the merchant successfully ran 3DS with the specified card brand in UTC RFC 3339 format.","format":"date-time","example":"2022-01-01T12:00:00Z","readOnly":true,"nullable":true}}}}},"card_account_updater_enabled":{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D/patch/requestBody/content/application~1json/schema/properties/card_account_updater_enabled"},"accelerated_ach_mode":{"readOnly":true,"description":"Determines if an ACH payin will utilize 