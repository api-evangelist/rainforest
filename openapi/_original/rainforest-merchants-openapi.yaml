ccepting terms","example":"127.0.0.1"},"terms_version":{"description":"Version of the accepted terms","type":"string","example":"1.0"}}}}}}}},"responses":{"204":{"description":"No Content"},"400":{"description":"Bad request, check for validation errors.","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/status"},"data":{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D~1applications~1%7Bmerchant_application_id%7D/patch/requestBody/content/application~1json/schema"},"errors":{"$ref":"#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/errors"}}}}}},"401":{"$ref":"#/paths/~1v1~1merchants/get/responses/401"},"403":{"$ref":"#/paths/~1v1~1merchants/get/responses/403"},"404":{"$ref":"#/paths/~1v1~1merchants/get/responses/404"},"5XX":{"$ref":"#/paths/~1v1~1merchants/get/responses/5XX"}},"tags":["Merchant Applications"]}},"/v1/merchants/{merchant_id}/applications/{merchant_application_id}/simulate":{"post":{"operationId":"simulate_merchant_application","summary":"Simulate merchant application status change","description":"Only available in the Rainforest sandbox environment.\n\nOnce the merchant application is submitted, in sandbox Rainforest does not decision the merchant for risk review. This endpoint can be utilized to simulate the decisioning. The merchant application must be in the status `PROCESSING`.\n\nThe expected webhooks will be sent for both the merchant and merchant application on the status change of the merchant application.","parameters":[{"$ref":"#/paths/~1v1~1merchants/get/parameters/0"},{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D/get/parameters/1","in":"path"},{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D~1applications~1%7Bmerchant_application_id%7D/get/parameters/2","in":"path"}],"requestBody":{"content":{"application/json":{"schema":{"description":"Simulation request for merchant application.","type":"object","properties":{"status":{"description":"Status to transition the merchant application to.\n\nAt this time, you may only transition a merchant application into the status `COMPLETED`, `DECLINED`, or `NEEDS_INFORMATION`.\n\nWhen transitioning into `COMPLETED`, the merchant's status will transition into `ACTIVE`.\n\nWhen transitioning into `DECLINED`, the merchant's status will transition into `CANCELED`.\n\nWhen transitioning into `NEEDS_INFORMATION`, the review of owner 1's name and SSN will be required by default. To specify other underwriting review types, provide underwriting_review_types.","type":"string","enum":["COMPLETED","DECLINED","NEEDS_INFORMATION"]},"underwriting_review_types":{"description":"When simulating into `NEEDS_INFORMATION` status, the default underwriting review type required is `DEPOSIT_METHOD_1`.  This will require the merchant to review and update their deposit method information.\n\nProviding an `underwriting_review_types` value is only allowed when `status` is `NEEDS_INFORMATION`.\n\nTo require other underwriting review types, you may provide an array of strings.  Supported values are:\n\n* `BUSINESS_NAME_TIN`: require the merchant to review and update their business's legal name and/or TIN value\n* `BUSINESS_VERIFICATION`: require the merchant to upload documents to verify their business registration\n* `FINANCIAL_1`: require the merchant to upload documents to complete a financial review, including processing statements or bank statements\n* `FINANCIAL_2`: require the merchant to upload documents to complete a financial review, including processing statements, bank statements, and financial statements\n* `DEPOSIT_METHOD_1`: require the merchant to update their funding bank account or upload a document, such as a bank letter or voided check\n* `OWNER_1_NAME_SSN`: require the merchant to review and update the first name, last name, and/or SSN for owner #1\n* `OWNER_2_NAME_SSN`: require the merchant to review and update the first name, last name, and/or SSN for owner #2\n* `OWNER_3_NAME_SSN`: require the merchant to review and update the first name, last name, and/or SSN for owner #3\n* `OWNER_4_NAME_SSN`: require the merchant to review and update the first name, last name, and/or SSN for owner #4\n\nIf any of the provided `underwriting_review_types` values are not applicable to the merchant application, a `400 Bad Request` will be returned indicating which values were not applicable to the application's merchant type.\n\nFor example, if the application has no owner #2 specified, requiring `OWNER_2_NAME_SSN` will result in a `400 Bad Request`.\n\nFINANCIAL_1 and FINANCIAL_2 are mutually exclusive and only one can be chosen as an underwriting review type.\n\nSimilarly, if the application's merchant type is `INDIVIDUAL` and `BUSINESS_NAME_TIN` is included, a `400 Bad Request` will be returned because an individual merchant type application does not collect business name and TIN values.","type":"array","items":{"type":"string","enum":["BUSINESS_NAME_TIN","DEPOSIT_METHOD_1","OWNER_1_NAME_SSN","OWNER_2_NAME_SSN","OWNER_3_NAME_SSN","OWNER_4_NAME_SSN"]},"minItems":1,"maxItems":6,"uniqueItems":true,"nullable":true}}}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"properties":{"status":{"$ref":"#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/status"},"data":{"description":"The merchant application. Applications are used for initial approval of a merchant and for updates to an existing merchant that must be re-approved.","type":"object","properties":{"merchant_application_id":{"$ref":"#/paths/~1v1~1merchants/post/responses/200/content/application~1json/schema/properties/data/properties/merchant_application_id","readOnly":true},"merchant_id":{"$ref":"#/paths/~1v1~1merchants/post/responses/200/content/application~1json/schema/properties/data/properties/merchant_id","readOnly":true},"platform_id":{"$ref":"#/paths/~1v1~1billing_pro