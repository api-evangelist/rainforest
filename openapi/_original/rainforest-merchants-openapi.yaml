 merchant before the application can be be approved. See the [review reasons](doc:additional-verification-for-merchant-onboarding#review-reasons) guide for requirements on each review type.\n\nKeys will be set for the underwriting review types that are applicable to the merchant application.\n\nIf no underwriting review types are required, this value will be `null`.","properties":{"business_name_tin":{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D~1applications~1%7Bmerchant_application_id%7D/patch/requestBody/content/application~1json/schema/properties/underwriting_reviews/properties/other","description":"Business name and TIN underwriting review type. Requires the merchant to review and update their business's legal name and/or TIN.\n\nThis key is not present if business name and TIN review is not applicable to the merchant application."},"business_verification":{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D~1applications~1%7Bmerchant_application_id%7D/patch/requestBody/content/application~1json/schema/properties/underwriting_reviews/properties/financial_1","description":"Business verification underwriting review type. Requires the merchant to upload documents to verify their business registration.\n\nThis key is not present if it is not applicable to the merchant application."},"deposit_method_1":{"description":"Deposit method underwriting review type. Requires the merchant to update their funding bank account or upload a document, such as bank letter or voided check.\n\nThis key is not present if it is not applicable to the merchant application.","type":"object","properties":{"updated_at":{"type":"string","readOnly":true,"nullable":true,"description":"Last updated date in UTC RFC 3339 format.","format":"date-time","example":"2022-01-01T12:00:00Z"},"file_upload_id":{"$ref":"#/paths/~1v1~1merchants~1%7Bmerchant_id%7D~1applications~1%7Bmerchant_application_id%7D/patch/requestBody/content/application~1json/schema/properties/underwriting_reviews/properties/fi