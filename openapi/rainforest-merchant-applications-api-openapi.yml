                        readOnly: true
                      card_release_delay_days:
                        $ref: '#/paths/~1v1~1merchants~1%7Bmerchant_id%7D/patch/requestBody/content/application~1json/schema/properties/card_release_delay_days'
                        readOnly: true
                      ach_release_delay_days:
