      description: Get merchant details by the merchant ID.
      parameters:
      - $ref: '#/paths/~1v1~1merchants/get/parameters/0'
      - in: path
        required: true
        name: merchant_id
        schema:
          type: string
        description: "The unique merchant identifier. \n\nPrefix is \"mid\" in production and \"sbx_mid\" in sandbox."
        examples:
          production:
            value: mid_2DrDFJPutxE5AIbJSopAnqniEbr
          sandbox:
            value: sbx_mid_2DrDFJPutxE5AIbJSopAnqniEbr
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  status:
                    $ref: '#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/status'
                  data:
                    $ref: '#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0'
                  errors:
                    $ref: '#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/errors'
        '400':
          $ref: '#/paths/~1v1~1merchants/get/responses/400'
        '401':
          $ref: '#/paths/~1v1~1merchants/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1merchants/get/responses/403'
        '404':
          $ref: '#/paths/~1v1~1merchants/get/responses/404'
        5XX:
          $ref: '#/paths/~1v1~1merchants/get/responses/5XX'
      tags:
      - Merchants
    patch:
      operationId: update_merchant
      summary: Update merchant
      description: Update supported fields on a merchant. Only fields included in the payload will be updated. Omitted fields will not be updated. Merchant status must be `ACTIVE`.
      parameters:
      - $ref: '#/paths/~1v1~1merchants/get/parameters/0'
      - $ref: '#/paths/~1v1~1merchants~1%7Bmerchant_id%7D/get/parameters/1'
        in: path
      requestBody:
        content:
          application/json:
            schema:
              description: The fields that can be updated on a merchant.
              type: object
              properties:
                deposit_frequency:
                  $ref: '#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0/properties/deposit_frequency'
                  description: 'The merchant deposit frequency for funding deposits. Supported values are `DAILY`, `WEEKLY`, or `MONTHLY`.


                    Platform must be configured for the specified deposit frequency, please reach out to Support or your Platform Success Manager if not configured for a deposit frequency.'
                card_release_delay_days:
                  description: 'The number of business days after processing until Card payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                ach_release_delay_days:
                  description: 'The number of business days after processing until ACH payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                validated_ach_release_delay_days:
                  description: 'The number of business days after processing until Validated ACH payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                balance_checked_ach_release_delay_days:
                  description: 'The number of business days after processing until Balance-Checked Validated ACH payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                paypal_wallet_release_delay_days:
                  description: 'The number of business days after processing until PayPal Wallet payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                venmo_release_delay_days:
                  description: 'The number of business days after processing until Venmo payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                paypal_paylater_release_delay_days:
                  description: 'The number of business days after processing until PayPal Pay Later payments are made available to the merchant in a deposit.


                    For example, 1 is T+1 and 2 is T+2'
                  type: integer
                card_account_updater_enabled:
                  description: Boolean indicating if card account updater is enabled.
                  type: boolean
                accelerated_ach_mode:
                  description: 'The Accelerated ACH status for this merchant.


                    Options:

                    * `ENABLED` - ACH payins will be accelerated, if applicable.

                    * `DISABLED` - ACH payins will not be accelerated.'
                  type: string
                  enum:
                  - ENABLED
                  - DISABLED
                reverse_payin_billing_fees_on_full_refund_enabled:
                  description: Boolean indicating if payin billing fees are reversed to the merchant when a refund for the full amount is processed.
                  type: boolean
                reverse_payin_billing_fees_on_ach_return_enabled:
                  description: Boolean indicating if payin billing fees are reversed to the merchant when an ACH return is processed.
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  status:
                    $ref: '#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/status'
                  data:
                    $ref: '#/paths/~1v1~1merchants/post/requestBody/content/application~1json/schema/allOf/0'
                  errors:
                    $ref: '#/paths/~1v1~1merchants/get/responses/200/content/application~1json/schema/properties/errors'
        '400':
          $ref: '#/paths/~1v1~1merchants/get/responses/400'
        '401':
          $ref: '#/paths/~1v1~1merchants/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1merchants/get/responses/403'
        '404':
          $ref: '#/paths/~1v1~1merchants/get/responses/404'
        5XX:
          $ref: '#/paths/~1v1~1merchants/get/responses/5XX'
      tags:
      - Merchants
