aid: rainforest
name: Rainforest
description: >-
  Rainforest is a payfac-as-a-service (payment-facilitator-as-a-service) provider that lets
  vertical SaaS platforms embed payments and monetize them as revenue. Platforms integrate via
  embeddable, PCI-scope-reducing Components (loaded from a JavaScript bundle and configured in
  Component Studio) or a direct server-to-server REST API, and Rainforest handles merchant
  onboarding (KYC/KYB), card and ACH processing, payouts/deposits, chargebacks, disputes, and
  PCI compliance. The API is organized into Authentication/API keys, Merchants and merchant
  applications, Payments (payins, payment methods, refunds, chargebacks, ACH returns, devices),
  Deposits, File Uploads, Forward Requests, and Health, versioned by date (current 2024-10-16)
  and secured with HTTP Bearer API keys plus short-lived Component session tokens. Rainforest is
  PCI DSS Level 1 certified and hosted on AWS. Backed by Accel, Matrix Partners, and Y Combinator.
